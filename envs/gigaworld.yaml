# Training / inference environment for the GigaWorld-0 backbone
# (DreamGen and AgiBot recipes).
#
#   conda env create -f envs/gigaworld.yaml
#   conda activate gigaworld
#   pip install -e .
#
# GigaWorld-0 additionally needs the upstream training framework and dataset
# packages, which are not on PyPI:
#   pip install git+https://github.com/open-gigaai/giga-train.git
#   pip install git+https://github.com/open-gigaai/giga-datasets.git
name: gigaworld
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.11
  - libgl
  - libglib
  - git-lfs
  - pip
  - pip:
      - torch==2.11.0
      - torchvision==0.26.0
      - torchaudio==2.11.0
      - diffusers==0.38.0
      - transformers==4.33.2
      - accelerate==1.13.0
      - deepspeed==0.19.1
      - peft==0.5.0
      - safetensors==0.8.0
      - fairscale==0.4.13
      - einops==0.8.2
      - omegaconf==2.3.1
      - numpy==1.26.4
      - av==17.1.0
      - decord==0.6.0
      - torchcodec==0.14.0
      - pillow==12.3.0
      - imageio==2.37.3
      - imageio-ffmpeg==0.6.0
      - opencv-python==4.11.0.86
      - datasets==3.6.0
      - pandas==3.0.3
      - tqdm==4.68.3
      - tensorboard==2.20.0
      - pyyaml==6.0.3
      - pyyaml-include==1.4.1
      - jsonlines==4.0.0
      - rich==15.0.0
      - regex==2026.5.9
      - sentencepiece==0.2.1
      - ftfy==6.3.1
