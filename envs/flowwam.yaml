# Training / inference environment for the FlowWAM backbone (RoboTwin recipe).
#
#   conda env create -f envs/flowwam.yaml
#   conda activate flowwam
#   pip install -e .
#   bash scripts/setup/clone_flowwam.sh
#
# The FlowWAM backbone is cloned into third_party/FlowWAM rather than vendored;
# see third_party/README.md for the upstream commit we pin to.
name: flowwam
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.11
  - libgl
  - libglib
  - git-lfs
  - pip
  - pip:
      - torch==2.11.0
      - torchvision==0.26.0
      - diffusers==0.38.0
      - transformers==4.33.2
      - accelerate==1.13.0
      - safetensors==0.8.0
      - einops==0.8.2
      - omegaconf==2.3.1
      - numpy==1.26.4
      - opencv-python==4.11.0.86
      - av==17.1.0
      - decord==0.6.0
      - torchcodec==0.14.0
      - pillow==12.3.0
      - imageio==2.37.3
      - imageio-ffmpeg==0.6.0
      - scikit-image==0.26.0
      - scikit-video==1.1.11
      - timm==1.0.12
      - openai-clip==1.0.1
      - lpips==0.1.4
      - tqdm==4.68.3
      - tensorboard==2.20.0
      - pyyaml==6.0.3
      - rich==15.0.0
      - regex==2026.5.9
      - ftfy==6.3.1
