# EVEWorld on RoboTwin, the cross-backbone transfer row of paper Table 5
# (tab:flowwam_transfer).
# Generation follows the paper protocol: --cfg-scale 5.0 --steps 40 --tia-inject off
# --full-traj direct --flow-cond robot_only --seed 42.
name: robotwin_flowwam_eveworld
seed: 42
output_dir: outputs/${name}
method:
  kind: eveworld
  p_dup: 0.5
  lambda_tia: 0.1
  warmup_steps: 0
  sigma_low: 0.2
  sigma_high: 0.5
  gated: false
  layer: 12
  window: 7
  temperature: 0.07
  gamma: 0.1
model:
  backbone: flowwam
  checkpoint: FlowWAM-Stage-1  # released Stage-1 weights, Wan2.2-TI2V-5B backbone
  resolution: [640, 480]  # (width, height)
  num_frames: 29
  fps: 24
  block_index: 12
train:
  optimizer: adamw
  lr: 1.0e-4
  weight_decay: 0.01
  batch_size: 8
  grad_accum: 1
  max_steps: 1128
  save_every: 100
  lora_rank: 32
data:
  root: .
  split: data/splits/robotwin/heldout.txt
  metadata: data/metadata/robotwin
inference:
  num_steps: 40
  cfg_scale: 5.0
  flow_cond: robot_only
  tia_inject: false  # the paper's reported RoboTwin setting uses --tia-inject off
eval:
  metrics: [mlr, robotwin]
  tau_occ: 0.15
  k: 2
notes: Full method on RoboTwin, 1128 steps, no noise gate on FlowWAM and inference-time TIA injection off.
