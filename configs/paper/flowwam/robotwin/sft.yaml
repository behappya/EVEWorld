# Standard SFT on the RoboTwin cross-backbone transfer experiment, the "+SFT" row of
# paper Table 5 (tab:flowwam_transfer). Rank-32 LoRA on the FlowWAM DiT, uniform loss.
name: robotwin_flowwam_sft
seed: 42
output_dir: outputs/${name}
method:
  kind: sft
  p_dup: 0.0
  lambda_tia: 0.0
  warmup_steps: 0
  sigma_low: 0.2
  sigma_high: 0.5
  gated: false
  layer: 12
  window: 7
  temperature: 0.07
  gamma: 0.1
model:
  backbone: flowwam
  checkpoint: FlowWAM-Stage-1  # released Stage-1 weights, Wan2.2-TI2V-5B backbone
  resolution: [640, 480]  # (width, height)
  num_frames: 29
  fps: 24
  block_index: 12
train:
  optimizer: adamw
  lr: 1.0e-4
  weight_decay: 0.01
  batch_size: 8
  grad_accum: 1
  max_steps: 1128
  save_every: 100
  lora_rank: 32
data:
  root: .
  split: data/splits/robotwin/heldout.txt
  metadata: data/metadata/robotwin
inference:
  num_steps: 40
  cfg_scale: 5.0
  flow_cond: robot_only
eval:
  metrics: [mlr, robotwin]
  tau_occ: 0.15
  k: 2
notes: RoboTwin SFT baseline, 1128 steps over 2250 episodes; the paper
  reports 11.687 PSNR, 0.735 SSIM, 0.414 LPIPS, 2.828 flow-EPE and
  47.89 MLR.
