# "+TIA" row of the RoboTwin cross-backbone transfer experiment (paper Table 5,
# tab:flowwam_transfer). TIA adapter on block 12 (the probe winner for FlowWAM), with a
# constant lambda_TIA = 0.1 and no noise gate; the IGR corruption is switched off.
name: robotwin_flowwam_tia
seed: 42
output_dir: outputs/${name}
method:
  kind: tia
  p_dup: 0.0
  lambda_tia: 0.1
  warmup_steps: 0
  sigma_low: 0.2
  sigma_high: 0.5
  gated: false
  layer: 12
  window: 7
  temperature: 0.07
  gamma: 0.1
model:
  backbone: flowwam
  checkpoint: FlowWAM-Stage-1  # released Stage-1 weights, Wan2.2-TI2V-5B backbone
  resolution: [640, 480]  # (width, height)
  num_frames: 29
  fps: 24
  block_index: 12
train:
  optimizer: adamw
  lr: 1.0e-4
  weight_decay: 0.01
  batch_size: 8
  grad_accum: 1
  max_steps: 1128
  save_every: 100
  lora_rank: 32
data:
  root: .
  split: data/splits/robotwin/heldout.txt
  metadata: data/metadata/robotwin
inference:
  num_steps: 40
  cfg_scale: 5.0
  flow_cond: robot_only
eval:
  metrics: [mlr, robotwin]
  tau_occ: 0.15
  k: 2
notes: TIA-only transfer arm; the paper reports 13.445 PSNR, 0.776 SSIM,
  0.333 LPIPS, 1.850 flow-EPE and 22.54 MLR.
