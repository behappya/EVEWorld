# IGR-only arm of the component ablation on DreamGenBench (paper Table 6).
# Instruction-grounded reconstruction with the binary {1, 3} weight map normalized to unit
# mean over the support region R_v4 union R_paste; the TIA term is switched off.
name: dreamgen_igr
seed: 42
output_dir: outputs/${name}
method:
  kind: igr
  p_dup: 0.5
  lambda_tia: 0.0
  warmup_steps: 0
  sigma_low: 0.2
  sigma_high: 0.5
  gated: false
  layer: 23
  window: 7
  temperature: 0.07
  gamma: 0.1
model:
  backbone: gigaworld0
  checkpoint: Video-Pretrain-2B
  resolution: [768, 480]  # (width, height)
  num_frames: 93
  fps: 16
  block_index: 23
train:
  optimizer: came8bit
  lr: 4.32e-5
  weight_decay: 0.01
  batch_size: 8
  grad_accum: 8
  max_steps: 250
  save_every: 50
data:
  root: .
  split: data/splits/dreamgen/train.txt  # the 92 post-training clips; val.txt selects the checkpoint
  metadata: data/metadata/dreamgenbench
inference:
  num_steps: 30
  cfg_scale: 7.0
eval:
  metrics: [mlr, qwen_if, gemini_if]
  tau_occ: 0.15
  k: 2
notes: IGR-only arm, 250 steps; the paper reports 4.76 MLR and 51.85 Gemini-IF overall.
