# Ablation: duplicate-restoration target (paper tab:igr_internal).
# p_dup is the probability of inserting a duplicate instance instead of relocating the
# original; 0.0 disables the duplicate corruption and leaves spatial emphasis only, which is
# the "spatial emphasis only" row of the IGR ablation table.
name: ablate_p_dup
seed: 42
output_dir: outputs/${name}
method:
  kind: igr
  p_dup: 0.5
  lambda_tia: 0.0
  warmup_steps: 0
  sigma_low: 0.2
  sigma_high: 0.5
  gated: false
  layer: 23
  window: 7
  temperature: 0.07
  gamma: 0.1
model:
  backbone: gigaworld0
  checkpoint: Video-Pretrain-2B
  resolution: [768, 480]  # (width, height)
  num_frames: 93
  fps: 16
  block_index: 23
train:
  optimizer: came8bit
  lr: 4.32e-5
  weight_decay: 0.01
  batch_size: 8
  grad_accum: 8
  max_steps: 250
  save_every: 50
data:
  root: .
  split: data/splits/dreamgen/train.txt  # the 92 post-training clips; val.txt selects the checkpoint
  metadata: data/metadata/dreamgenbench
inference:
  num_steps: 30
  cfg_scale: 7.0
eval:
  metrics: [mlr, qwen_if, gemini_if]
  tau_occ: 0.15
  k: 2
ablation:
  axis: p_dup
  artifact: tab:igr_internal
  select: method.p_dup
  values: [0.0, 0.25, 0.5, 0.75]
notes: Duplicate-probability sweep around the paper value of 0.5; the lower
  end approaches the spatial-emphasis-only variant.
