# Ablation: checkpoint-step selection under a multiseed replay (paper app:evaluation_stability,
# tab:seed_variance_full). Checkpoints at steps 150 and 250 are replayed over seeds 1 to 70
# with 30 inference steps; the paper uses the step-250 raw checkpoint.
name: ablate_checkpoint_steps
seed: 42
output_dir: outputs/${name}
method:
  kind: eveworld
  p_dup: 0.5
  lambda_tia: 0.5
  warmup_steps: 20
  sigma_low: 0.2
  sigma_high: 0.5
  gated: true
  layer: 23
  window: 7
  temperature: 0.07
  gamma: 0.1
model:
  backbone: gigaworld0
  checkpoint: Video-Pretrain-2B
  resolution: [768, 480]  # (width, height)
  num_frames: 93
  fps: 16
  block_index: 23
train:
  optimizer: came8bit
  lr: 4.32e-5
  weight_decay: 0.01
  batch_size: 8
  grad_accum: 8
  max_steps: 250
  save_every: 50
data:
  root: .
  split: data/splits/dreamgen/train.txt  # the 92 post-training clips; val.txt selects the checkpoint
  metadata: data/metadata/dreamgenbench
inference:
  num_steps: 30
  cfg_scale: 7.0
eval:
  metrics: [mlr, qwen_if, gemini_if]
  tau_occ: 0.15
  k: 2
ablation:
  axis: checkpoint_step
  artifact: app:evaluation_stability
  select: train.max_steps
  checkpoints: [150, 250]
  seed_range: [1, 70]
  inference_steps: 30
notes: Checkpoint-step sweep with the 70-seed replay, used to check the
  ordering of the compared arms across seeds.
