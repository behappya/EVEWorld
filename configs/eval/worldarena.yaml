# WorldArena 1.0 zero-shot evaluation (paper Table 3, tab:worldarena). The released
# evaluator aggregates the eight core metrics plus an Overall score, which are the names
# below; the object-level VBench names (object_class, multiple_objects) belong to the wider
# VBench suite and are not part of the WorldArena 1.0 core scoring.
name: eval_worldarena
seed: 42
output_dir: outputs/${name}
data:
  root: .
  split: data/splits/worldarena/eval.txt
  metadata: data/metadata/worldarena
eval:
  metrics: [subject_consistency, background_consistency, motion_smoothness, dynamic_degree,
            aesthetic_quality, image_quality, flow_score, photometric_smoothness, overall]
  num_prompts: 1000
notes: WorldArena 1.0 over 1,000 prompts.
