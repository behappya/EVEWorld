# Format and lint hooks for a local commit. The version floors and the settings below mirror
# pyproject.toml, so a run of `pre-commit run --all-files` and an editor configured from
# pyproject.toml agree with each other. Heavier checks stay out of the commit path: the test suite
# is a manual-stage hook, run with `pre-commit run --hook-stage manual pytest`.

exclude: |
  (?x)^(
    third_party/|
    assets/|
    outputs/|
    paper/|
    .*\.(mp4|png|svg|pdf)
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: mixed-line-ending
        args: ["--fix=no"]

  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black", "--line-length", "150"]

  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        args: ["--line-length", "150", "--skip-string-normalization"]

  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.0
    hooks:
      - id: flake8
        args: ["--max-line-length", "150", "--extend-ignore", "E203,W503,E501"]

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest
        language: system
        args: ["tests/"]
        pass_filenames: false
        always_run: true
        stages: [manual]
